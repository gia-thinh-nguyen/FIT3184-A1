apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-parking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-parking
  template:
    metadata:
      labels:
        app: smart-parking
    spec:
      containers:
        - name: smart-parking
          image: australia-southeast2-docker.pkg.dev/lyrical-compass-509609-c6/smart-parking-repo/smart-parking:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20